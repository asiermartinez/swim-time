name: test

# Only code and config changes; data commits from the sample workflow are
# pushed with GITHUB_TOKEN and never trigger other workflows anyway.
on:
  push:
    paths:
      - "cmd/**"
      - "go.mod"
      - "pools.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "go.mod"
      - "pools.json"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...

      - run: go test -race ./...
